<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon's source: a twig with a thorn, drawn as a stroke on a
       page, over the same green leaf's icon uses — the org's family. The
       backdrop is inset, as Apple's template asks (a macOS icon is drawn at
       824 of 1024 and the system rounds it), so a corner is never clipped.
       `scripts/app-icon.sh` rasterises it into the asset catalog. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26a08d"/>
      <stop offset="1" stop-color="#177b6c"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#g)"/>
  <!-- The page: a sheet a drawing sits on. -->
  <rect x="262" y="212" width="500" height="600" rx="36" fill="#fbfbf9"/>
  <!-- The twig, rising from the foot of the page, and its thorn. -->
  <g fill="none" stroke="#1e8f7e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 760 C 512 640, 470 560, 500 430 S 560 330, 540 270" stroke-width="30"/>
    <path d="M496 470 L 400 380" stroke-width="22"/>
    <path d="M540 380 L 620 300" stroke-width="22"/>
  </g>
  <path d="M478 560 L 430 500 L 500 528 Z" fill="#1e8f7e"/>
</svg>
