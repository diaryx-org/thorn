name: Thorn
options:
  bundleIdPrefix: org.diaryx
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

# Thorn, the drawing app — one cross-platform host for the `Thorn` package's
# `DrawingEditor`. The same SwiftUI sources build for macOS (AppKit canvas) and
# iOS (UIKit canvas); the package already carries both, so `App/` is chrome
# only: the document class, the menus, the icon.
#
# The editor is consumed as a local Swift package: `Thorn` (the editor) →
# `ThornFFI` (the generated binding, built from source) → the C module in
# `packages/thorn-swift/uniffi-generated/headers`. The package manifest lives
# at the repo root (SwiftPM's requirement for by-version consumption), so the
# local path is the repo itself. The Rust staticlib is force-loaded (below) and
# rebuilt by the pre-build script every Xcode build, so Rust changes always
# take effect without re-running `bootstrap.sh` (needed only on first setup or
# when the Rust *API* changes and the binding must be regenerated).
packages:
  ThornFFI:
    path: ../..

targets:
  Thorn:
    type: application
    # A single multiplatform target: Xcode builds it for whichever destination
    # is selected (My Mac / an iOS simulator / a device). The package compiles
    # the matching AppKit or UIKit canvas behind `#if canImport(...)`.
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: ThornFFI
        product: Thorn
    # The document type, which is what puts Thorn in Finder's Open With for an
    # `.svg` and the Files app's share sheet, and lets the Open panel enable
    # one. `public.svg-image` is the system's type; Thorn is an alternate
    # handler because every SVG opens here but only a drawing of the profile
    # (docs/profile.md) edits without findings. xcodegen writes these into
    # App/Info.plist (git-ignored, regenerated with the project); the
    # INFOPLIST_KEY_* settings below merge into it at build time.
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: SVG Drawing
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.svg-image]
        # A document app on iOS opens to the browser; without this key it
        # opens to a blank scene.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.diaryx.thorn
        PRODUCT_NAME: Thorn
        # The package's editor module is `Thorn` too; the app's module takes
        # another name so the two do not write one `Thorn.swiftmodule`.
        PRODUCT_MODULE_NAME: ThornApp
        # The workspace version, written here by `cargo xtask sync-versions`
        # as part of a release bump.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        # App icon, from the Icon Composer source at App/thorn.icon (picked up
        # automatically — it's a normal member of the App/ sources path above).
        # actool compiles it straight into every icon size/appearance for both
        # platforms, no .xcassets entry needed.
        ASSETCATALOG_COMPILER_APPICON_NAME: thorn
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Per-key values (incl. iOS-only ones) come from INFOPLIST_KEY_* below,
        # SDK-conditional where they differ, and merge into App/Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thorn
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT or Apache-2.0"
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphoneos*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphonesimulator*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # An iPad takes every orientation: App Store validation refuses an
        # iPad build that multitasks with any missing.
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphoneos*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphonesimulator*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # macOS: an ordinary windowed app.
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.graphics-design
        # Language mode 5 — the Swift-6 strict-concurrency checker would reject
        # the FFI handle crossing the main-actor boundary; the model serialises
        # access.
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: YES
        # Apple Silicon only on the Mac. An archive — Xcode Cloud's, for the
        # App Store — targets `generic/platform=macOS`, which has no active
        # arch, so ONLY_ACTIVE_ARCH does not apply and Xcode builds
        # ARCHS_STANDARD, still `arm64 x86_64`; the pre-build phase below builds
        # the staticlib for aarch64-apple-darwin alone, and the x86_64 link
        # fails on every `_uniffi_*` symbol. A universal build is a second Rust
        # build and a lipo per archive, with twig compiled from Zig source for
        # want of a prebuilt x86_64 payload; Intel Macs are not worth that
        # here. iOS is unaffected: a device archive is arm64 already.
        "ARCHS[sdk=macosx*]": arm64
        # The simulator needs no signing. The Mac needs none in Debug (below);
        # its Release build is the App Store's, and is signed.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        # A real iPhone refuses an unsigned binary, and a device build — or
        # the Mac's App Store build — needs a provisioning profile, which needs
        # a team; automatic signing then mints and renews the profile itself. Set here rather than in Xcode's
        # Signing & Capabilities pane: the .xcodeproj is gitignored and
        # regenerated, so a change made in the UI is lost at the next
        # `xcodegen generate`. Same team as leaf's apps/leaf-editor/project.yml.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V4322HH5HU
        # No encryption beyond the system's, so App Store Connect asks no
        # export-compliance question of each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Force-load the Rust staticlib the pre-build script produces. The path
        # is SDK-conditional (mac vs sim vs device); $(THORN_STATIC_LIB) picks
        # the match. PROJECT_DIR is apps/thorn-editor → ../.. is the repo root
        # whose `target/` cargo writes into.
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(THORN_STATIC_LIB)"
        "THORN_STATIC_LIB[sdk=macosx*]": "$(PROJECT_DIR)/../../target/aarch64-apple-darwin/debug/libthorn_svg_ffi.a"
        "THORN_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/debug/libthorn_svg_ffi.a"
        "THORN_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/debug/libthorn_svg_ffi.a"
      configs:
        # Debug is the local harness: unsigned and unsandboxed on the Mac, so
        # `cargo xtask swift` builds on a machine with no certificate at all.
        Debug:
          "CODE_SIGNING_ALLOWED[sdk=macosx*]": NO
          "CODE_SIGNING_REQUIRED[sdk=macosx*]": NO
          "CODE_SIGN_IDENTITY[sdk=macosx*]": ""
          "ENABLE_APP_SANDBOX[sdk=macosx*]": NO
        # Release is the App Store's shape, which Xcode Cloud archives: signed
        # through the automatic signing above, and sandboxed. The sandbox grants
        # a document app the file it was handed, and a drawing of the profile is
        # one file — its style, markers and ink are inside the `<svg>` — so the
        # user-selected read-write grant is the whole of it. Fonts are read from
        # /System/Library/Fonts, which the sandbox leaves readable. The two
        # settings are Xcode's entitlement build settings, which write the
        # entitlements at signing time; there is no .entitlements file to keep
        # in step. A Release build run locally behaves as the shipped app does.
        Release:
          "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
          "ENABLE_USER_SELECTED_FILES[sdk=macosx*]": readwrite
          "THORN_STATIC_LIB[sdk=macosx*]": "$(PROJECT_DIR)/../../target/aarch64-apple-darwin/release/libthorn_svg_ffi.a"
          "THORN_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release/libthorn_svg_ffi.a"
          "THORN_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libthorn_svg_ffi.a"
    preBuildScripts:
      - name: "Build thorn-svg-ffi staticlib"
        basedOnDependencyAnalysis: false
        # Declaring the staticlib as an output tells the build system this
        # phase produces it, so it schedules before the link step and doesn't
        # fail the planning-stage "input file not found" check when the .a
        # doesn't exist yet.
        outputFiles:
          - "$(THORN_STATIC_LIB)"
        shell: /bin/bash
        script: |
          set -euo pipefail
          # Xcode's build env has a minimal PATH; add the user's toolchains.
          # ~/.local/bin is where ci_scripts/ci_post_clone.sh puts Zig on Xcode
          # Cloud, which twig-sys compiles from source for the iOS targets.
          export PATH="$HOME/.nix-profile/bin:$HOME/.cargo/bin:$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          cd "${PROJECT_DIR}/../.."        # repo root (workspace Cargo.toml)

          case "${PLATFORM_NAME}" in
            macosx)           RUST_TARGET="aarch64-apple-darwin" ;;
            iphonesimulator)  RUST_TARGET="aarch64-apple-ios-sim" ;;
            *)                RUST_TARGET="aarch64-apple-ios" ;;
          esac
          [ "${CONFIGURATION}" = "Release" ] && CARGO_FLAGS="--release" || CARGO_FLAGS=""

          echo "thorn-svg-ffi: cargo build -p thorn-svg-ffi --target ${RUST_TARGET} ${CARGO_FLAGS}"
          rustup target add "${RUST_TARGET}" 2>/dev/null || true
          cargo build -p thorn-svg-ffi --target "${RUST_TARGET}" ${CARGO_FLAGS}

schemes:
  Thorn:
    build:
      targets:
        Thorn: all
    run:
      config: Debug
