[package]
name = "thorn-svg-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "UniFFI binding over thorn-svg-core: the drawing editor's shape model, profile check and gestures for an AppKit/UIKit canvas. A host links it into its one Rust staticlib. UniFFI, so Kotlin and Python bindings are a generator run away."
keywords = ["svg", "drawing", "editor", "swift", "uniffi"]
categories = ["multimedia::images", "external-ffi-bindings"]

# staticlib -> the .a a host force-loads (alongside its own FFI crate).
# cdylib    -> a .dylib for `uniffi-bindgen --library` to introspect, and for
#              the Swift tests to link.
# lib       -> lets a host's own FFI crate depend on this one, so that the
#              scaffolding lands in the host's single staticlib.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]

# The bindings generator. `scripts/gen-bindings.sh` runs it as
#   cargo run -p thorn-svg-ffi --bin uniffi-bindgen -- generate --library …
# Kept in-tree so the generator version can never drift from the `uniffi`
# runtime this crate links.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
thorn-svg-core.workspace = true
# The FFI machinery, proc-macro mode (no .udl file). `cli` pulls in
# `uniffi_bindgen_main` for the bin target above. Same version as leaf-ffi and
# resvg-uniffi: a host links exactly one uniffi runtime.
uniffi = { version = "0.28", features = ["cli"] }
thiserror.workspace = true

# SVG as vectors for the canvas view. Nothing here calls it: it is linked so
# that its UniFFI scaffolding lands in *this* crate's staticlib, which is the
# one archive a host force-loads — two Rust archives in one executable is a
# duplicate-`std` link error, so a second binding crate can only ride along
# inside the first. The Swift side (`ResvgCoreGraphics`, from the resvg-swift
# package the canvas depends on) finds its `resvg_uniffi` symbols there. A
# host that already carries resvg-uniffi in its own FFI crate (leaf-ffi does)
# gets one copy either way, because Cargo unifies the version.
resvg-uniffi = "0.1.1"
