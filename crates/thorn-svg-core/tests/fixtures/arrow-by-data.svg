<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" data-diaryx-drawing="1">
  <!-- The arrow as the editor writes it: data-arrow says what it is, the style says how a head looks. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <style>
    rect, ellipse { fill: none; stroke: #222; stroke-width: 2 }
    line { stroke: #222; stroke-width: 2 }
    line[data-arrow="end"], line[data-arrow="both"] { marker-end: url(#arrow) }
    line[data-arrow="start"], line[data-arrow="both"] { marker-start: url(#arrow) }
  </style>
  <rect x="20" y="40" width="100" height="60" data-id="s1"/>
  <ellipse cx="250" cy="70" rx="50" ry="30" data-id="s2"/>
  <line x1="120" y1="70" x2="198" y2="70" data-arrow="end" data-id="s3" data-from="s1" data-to="s2"/>
  <line x1="70" y1="120" x2="250" y2="120" data-arrow="both" data-id="s4"/>
</svg>
