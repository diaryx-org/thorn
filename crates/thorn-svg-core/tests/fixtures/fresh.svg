<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" color="#222" data-diaryx-drawing="1">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <style>
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6 } }
    rect, ellipse, polygon { fill: none; stroke: currentColor; stroke-width: 2 }
    line, path { fill: none; stroke: currentColor; stroke-width: 2 }
    line[data-arrow="end"], line[data-arrow="both"], path[data-arrow="end"], path[data-arrow="both"] { marker-end: url(#arrow) }
    line[data-arrow="start"], line[data-arrow="both"], path[data-arrow="start"], path[data-arrow="both"] { marker-start: url(#arrow) }
    marker path { fill: currentColor; stroke: none }
    path[data-ink] { fill: currentColor; stroke: none }
    text { font: 16px sans-serif; fill: currentColor }
  </style>
</svg>
