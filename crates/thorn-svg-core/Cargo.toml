[package]
name = "thorn-svg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "The frontend-neutral core of a drawing editor over twig's SVG: the Diaryx drawing profile, a shape model read from the element tree, and gestures that each end in one twig splice and one undo step."
keywords = ["svg", "drawing", "editor", "twig", "diaryx"]
categories = ["multimedia::images", "text-editors"]

[features]
# `measure::Usvg`: a label's box laid out by resvg's usvg over the system's
# fonts. Off, a `Drawing` needs a host's `Measure`, or falls back to a
# nominal box. The FFI crate turns it on, since its host draws with resvg.
usvg = ["dep:usvg"]

[dependencies]
twig-doc.workspace = true
svgtypes.workspace = true
thiserror.workspace = true
usvg = { workspace = true, optional = true }
