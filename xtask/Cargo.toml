[package]
name = "xtask"
version.workspace = true
edition.workspace = true
description = "The workspace's task runner: `cargo xtask <task>` — the steps that leave Rust (the UniFFI binding, the app) and the checks CI calls."
# A development harness, never a published artifact.
publish = false

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
