name: CI
# The `job` list in .config/ship.figl is the definition of green, and `ship ci`
# runs it; this file only decides where: on Linux, the app's window included,
# as Blitz builds there with fontconfig and nothing else of the system's.
on:
  push: { branches: [main] }
  pull_request: null
  workflow_dispatch: null

# Cancel superseded runs on the same ref — a new push makes the old one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # All of ship.figl's jobs, in order, on one runner. The name is older than
  # ship: it is a required status check, so it stays `CI / cargo xtask ci`.
  rust:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # rust-toolchain.toml names the toolchain; rustup installs it on first use.
    - uses: Swatinem/rust-cache@v2
    # Blitz finds the system's fonts through fontconfig, as unit's CI has it.
    - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    - run: cargo install --locked --git https://github.com/diaryx-org/ship ship
    - run: ship ci
