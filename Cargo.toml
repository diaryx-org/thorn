[workspace]
resolver = "3"
# Listed rather than globbed: `xtask` reads this line to know what CI covers.
members = [
  "crates/svg-editor-core",
  "crates/svg-editor-ffi",
  "apps/svg-editor",
  "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
# Minimum supported Rust version. Edition 2024 needs 1.85; let-chains 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/svg-editor"
readme = "README.md"

[workspace.dependencies]
# The tree editor under everything: parses the SVG as XML, keeps every byte it
# is not asked to change, and owns undo. By crates.io version, as every
# cross-repo edge in the org is; `~/diaryx/.cargo/patches.toml` is how to build
# against a checkout. 3.8.1 is the first release with `set_node_attrs`,
# `move_before`/`move_after` and the `svg` dialect — the move, resize and
# reorder gestures.
twig-doc = "3.8.1"
# Rendering for the CLI's `render` and for a test that wants pixels. Same major
# as leaf-raster and resvg-swift, so a host linking all three gets one copy.
resvg = "0.46"
anyhow = "1"
thiserror = "2"
# Internal crates.
svg-editor-core = { path = "crates/svg-editor-core", version = "0.1.0" }
