[workspace]
resolver = "3"
# Listed rather than globbed: `xtask` reads this line to know what CI covers.
members = [
  "crates/thorn-svg-core",
  "crates/thorn-svg-ffi",
  "crates/thorn-dioxus",
  "apps/thorn-svg",
  "apps/thorn-dioxus",
  "xtask",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
# Minimum supported Rust version. Edition 2024 needs 1.85; let-chains 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/thorn"
readme = "README.md"

[workspace.dependencies]
# The tree editor under everything: parses the SVG as XML, keeps every byte it
# is not asked to change, and owns undo. By crates.io version, as twig is one
# of the org's foundations that stays there; `~/diaryx/.cargo/patches.toml` is
# how to build against a checkout. twig 6 names no language, so SVG comes from
# `twig-xml`, which registers it on first use. Without the default `fig`
# feature: that is twig reading a document's frontmatter, and an SVG has
# none, so the core links no fig language crates it would never call.
twig-doc = { version = "7", default-features = false }
twig-xml = "7"
# Rendering for the CLI's `render` and for a test that wants pixels. Same major
# as leaf-raster and resvg-swift, so a host linking all three gets one copy.
resvg = "0.46"
# Text layout alone, for the core's `measure::Usvg`: the same crate resvg
# and resvg-swift lay text out with, so a label's measured box is the box
# the canvas draws. Same version as resvg, or there would be two.
usvg = "0.46"
# Parses a `<path>`'s `d` (into absolute lines and curves) and a `transform`
# list (into one matrix) for the core's hit-testing. The resvg family's own
# parser, so the extent the editor computes is over the segments resvg
# draws; kurbo comes with it and nothing else.
svgtypes = "0.16"
# The editor under a `<style>` and a `style` attribute: CSS as a fig
# language, so every edit to it is a splice that keeps the bytes it is not
# asked to change. Its own repo since leaf edits a `style` too.
fig-css = { git = "https://github.com/diaryx-org/fig-css", branch = "main" }
# fig itself only for a test that edits a stylesheet through fig's editor;
# fig-css carries the version that matters.
fig = "7.0.0"
anyhow = "1"
thiserror = "2"
# The editor's components and the app's window: Dioxus 0.8's alpha, as leaf
# and Diaryx are built on, drawn by its native renderer (Blitz) with no
# webview. The components name only `dioxus`; the app adds the renderer.
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# diaryx-org's components for Dioxus, which work under Blitz and are read by
# assistive tech: the toolbar's buttons, the menus, the swatches.
unit = { git = "https://github.com/diaryx-org/unit", branch = "main" }
# Internal crates.
thorn-svg-core = { path = "crates/thorn-svg-core", version = "0.2.0" }
thorn-dioxus = { path = "crates/thorn-dioxus", version = "0.2.0" }

# A debug build with full debug info is several hundred megabytes; line
# tables are enough for a panic's file and line.
[profile.dev]
debug = "line-tables-only"

# Every dependency optimised, even in a debug build: unoptimised, Stylo,
# parley and Vello take ten times as long to draw a frame, and the canvas
# redraws on every pointer move. A profile here governs only builds of this
# workspace.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# Blitz from diaryx-org's fork, its `leaf` branch at the version
# dioxus-native pins, as leaf, unit and Diaryx take it: its accessibility
# tree reads ARIA's roles and states (unit's controls are read by it), a
# removed node is forgotten by its layout parent, a press focuses what it
# lands on, and assistive tech's click is carried out. Every Blitz crate in
# the graph comes from the fork: the fork's crates depend on each other by
# path, so one from crates.io beside them would be a second copy.
blitz-dom = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-traits = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-shell = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-paint = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-net = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-html = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
stylo_taffy = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
debug_timer = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
accesskit_xplat = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
# winit's macOS backend, patched in the fork (its patches/ PATCH.md): its
# text input client answers what is round the caret, and keeps an
# insertText that ends no composition — a label's accents and emoji.
winit-appkit = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
