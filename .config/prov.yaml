title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
identity: lazy
fixity: attachments
recycle_bin: false
history: off
about: off
workspace_id: dxttmgp6j
root: README.md
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  # The org's `tasks` preset. The argument for this repository's existence
  # is the org's proposal; a proposal about its code is its own.
  status:
    - under: '[[Tasks]]'
      values: closed
      vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
      default: open
    - under: '[[Proposals]]'
      values: closed
      vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
      default: draft
  created: { type: date }
  updated: { type: date }
views:
  open-tasks:
    label: Open tasks
    where: "under('[[Tasks]]') && present(status) && !('done' in field('status') || 'dropped' in field('status'))"
    key: status
  proposals:
    label: Proposals
    where: "under('[[Proposals]]') && present(status)"
    key: status
  work:
    label: All work
    where: "present(status)"
    key: status
exports:
  www:
    label: thorn on diaryx.org
    gate:
      field: audience
      value: public
